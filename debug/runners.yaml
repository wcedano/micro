# Available runners configured by board.cmake.
runners:
- linkserver
- jlink

# Default flash runner if --runner is not given.
flash-runner: linkserver

# Default debug runner if --runner is not given.
debug-runner: linkserver

# Common runner configuration values.
config:
  board_dir: /home/wilgaced/Desktop/ITLA/micro/nxpproject/rgb_control/sdks/rgb_control_sdk/mcuxsdk/examples/_boards/frdmmcxa156
  # Build outputs:
  bin_file: rgb_control.bin
  elf_file: rgb_control.elf
  hex_file: rgb_control.hex
  # Host tools:
  gdb: /home/wilgaced/.mcuxpressotools/arm-gnu-toolchain-14.2.rel1-x86_64-arm-none-eabi/bin/arm-none-eabi-gdb-py

# Runner specific arguments
args:
  linkserver:
    - --dt-flash=y
    - --device=MCXA156:FRDM-MCXA156
  jlink:
    - --dt-flash=y
    - --device=MCXA156
